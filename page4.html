<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gefunden!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            overflow-y: auto;
            padding: 48px 16px;
            background: #FFF1D6;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 32px 40px;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 960px;
            width: 100%;
        }
        h1 { font-size: 42px; margin-bottom: 12px; color: #EB6222; font-weight: 700; }
        p { font-size: 18px; color: #EB6222; margin-bottom: 20px; }

        .sudoku-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            justify-items: center;
            width: 100%;
        }

        .side-image {
            width: 180px;
            max-width: 100%;
            object-fit: cover;
        }

        .side-image.draggable {
            cursor: grab;
            position: fixed;
            z-index: 10;
        }

        .side-image.draggable:active {
            cursor: grabbing;
        }

        .sudoku-wrapper.fade-out {
            animation: fadeOutSudoku 1s ease-out forwards;
        }

        @keyframes fadeOutSudoku {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        .sudoku-wrapper { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(5, 60px);
            gap: 8px;
            background: #e9ecff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px #d0d6ff;
        }
        .cell {
            position: relative;
        }
        .cell input {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 22px;
            border: 1px solid #d0d6ff;
            border-radius: 10px;
            background: #fff;
            outline: none;
            font-family: inherit;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .cell input:focus {
            border-color: #4346fc;
            box-shadow: 0 0 0 3px rgba(67,70,252,0.15);
        }
        .prefilled {
            background: #f0f2ff;
            font-weight: bold;
            pointer-events: none;
            border-color: #c7cef9;
        }
        .controls { width: 100%; display: flex; gap: 10px; }
        #check-btn, #reset-btn {
            flex: 1;
            padding: 12px 18px;
            border: 3px solid #333;
            border-radius: 0;
            background: #FFC700;
            color: #000;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.15s ease;
            font-family: 'Courier New', monospace;
        }
        #reset-btn { background: #FFC700; color: #000; }
        #check-btn:hover, #reset-btn:hover { transform: translate(2px, 2px); }
        #check-btn:active, #reset-btn:active { transform: translate(4px, 4px); }
        #result { margin-top: 8px; font-weight: bold; color: #EB6222; }
        #restart { display: none; margin-top: 6px; }

        .password-bubble {
            position: fixed;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 100;
            display: none;
            text-align: center;
            min-width: 280px;
            pointer-events: auto;
        }

        .password-bubble::before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid white;
        }

        .password-bubble.show {
            display: block;
            animation: bubbleFadeIn 0.3s ease-out;
        }

        @keyframes bubbleFadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .password-bubble h2 {
            margin: 0 0 20px 0;
            color: #EB6222;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }

        .password-bubble input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .password-bubble button {
            margin-top: 15px;
            padding: 12px 30px;
            background: #FFC700;
            color: #000;
            border: 3px solid #333;
            border-radius: 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.15s ease;
            font-family: 'Courier New', monospace;
        }

        .password-bubble button:hover {
            transform: translate(2px, 2px);
        }

        .password-bubble .error {
            color: #dc3545;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Mini-Sudoku (5×5)</h1>
        <p>Oh nein! Das Sudoku ist zwischen uns. Schnell, löse es!</p>

        <div class="sudoku-container">
            <img src="left-person.jpg" alt="Linke Person" class="side-image" id="leftPerson">

            <div class="sudoku-wrapper">
                <div class="sudoku-grid" id="sudoku">
                <!-- Row 1 -->
                <div class="cell"><input class="prefilled" value="1" readonly></div>
                <div class="cell"><input class="prefilled" value="2" readonly></div>
                <div class="cell"><input data-answer="3" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input data-answer="4" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="5" readonly></div>

                <!-- Row 2 -->
                <div class="cell"><input class="prefilled" value="2" readonly></div>
                <div class="cell"><input data-answer="3" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="4" readonly></div>
                <div class="cell"><input data-answer="5" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input data-answer="1" maxlength="1" inputmode="numeric"></div>

                <!-- Row 3 -->
                <div class="cell"><input data-answer="3" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="4" readonly></div>
                <div class="cell"><input data-answer="5" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="1" readonly></div>
                <div class="cell"><input data-answer="2" maxlength="1" inputmode="numeric"></div>

                <!-- Row 4 -->
                <div class="cell"><input data-answer="4" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input data-answer="5" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="1" readonly></div>
                <div class="cell"><input data-answer="2" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="3" readonly></div>

                <!-- Row 5 -->
                <div class="cell"><input class="prefilled" value="5" readonly></div>
                <div class="cell"><input data-answer="1" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input data-answer="2" maxlength="1" inputmode="numeric"></div>
                <div class="cell"><input class="prefilled" value="3" readonly></div>
                <div class="cell"><input data-answer="4" maxlength="1" inputmode="numeric"></div>
                </div>

                <div class="controls">
                    <button id="check-btn">Prüfen</button>
                    <button id="reset-btn">Zurücksetzen</button>
                </div>
                <div id="result"></div>
                <a id="restart" href="index.html">Zurück zum Start</a>
            </div>

            <img src="right-person.jpg" alt="Rechte Person" class="side-image" id="rightPerson">
        </div>
    </div>

    <div class="password-bubble" id="passwordBubble">
        <h2>Küss mich, wenn du weiter machen willst.</h2>
        <input type="password" id="passwordInput" placeholder="Passwort eingeben">
        <div class="error" id="passwordError"></div>
        <button id="submitPassword">Weiter</button>
    </div>

    <script>
        const cells = Array.from(document.querySelectorAll('.sudoku-grid input'));
        const result = document.getElementById('result');
        const restart = document.getElementById('restart');
        const checkBtn = document.getElementById('check-btn');
        const resetBtn = document.getElementById('reset-btn');

        // Erlaube nur Ziffern 1-5
        cells.forEach(input => {
            if (input.hasAttribute('readonly')) return;
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^1-5]/g, '').slice(0, 1);
            });
        });

        function checkSudoku() {
            let allFilled = true;
            let allCorrect = true;

            cells.forEach(input => {
                const answer = input.dataset.answer;
                if (answer) {
                    if (!input.value) allFilled = false;
                    if (input.value !== answer) allCorrect = false;
                }
            });

            if (!allFilled) {
                result.textContent = 'Fülle alle Felder mit 1-5 aus.';
                result.style.color = '#d62828';
                restart.style.display = 'none';
                return;
            }

            if (allCorrect) {
                result.textContent = 'Perfekt gelöst!';
                result.style.color = '#28a745';
                restart.style.display = 'inline-block';
                enableDragging();
            } else {
                result.textContent = 'Leider falsch, versuch es erneut.';
                result.style.color = '#d62828';
                restart.style.display = 'none';
            }
        }

        function resetSudoku() {
            cells.forEach(input => {
                if (!input.hasAttribute('readonly')) {
                    input.value = '';
                }
            });
            result.textContent = '';
            restart.style.display = 'none';
        }

        checkBtn.addEventListener('click', checkSudoku);
        resetBtn.addEventListener('click', resetSudoku);

        // Nach erfolgreicher Lösung: Sudoku ausblenden und Bilder draggable machen
        function enableDragging() {
            const leftImg = document.getElementById('leftPerson');
            const rightImg = document.getElementById('rightPerson');
            const sudokuWrapper = document.querySelector('.sudoku-wrapper');

            // Sudoku ausblenden
            sudokuWrapper.classList.add('fade-out');

            setTimeout(() => {
                // Position VOR dem Ausblenden erfassen
                const leftRect = leftImg.getBoundingClientRect();
                const rightRect = rightImg.getBoundingClientRect();
                
                sudokuWrapper.style.display = 'none';

                // Bilder in fixed position für dragging umwandeln
                leftImg.style.position = 'fixed';
                leftImg.style.left = leftRect.left + 'px';
                leftImg.style.top = leftRect.top + 'px';
                leftImg.style.margin = '0';
                leftImg.classList.add('draggable');

                rightImg.style.position = 'fixed';
                rightImg.style.left = rightRect.left + 'px';
                rightImg.style.top = rightRect.top + 'px';
                rightImg.style.margin = '0';
                rightImg.classList.add('draggable');

                // Drag-Funktionalität aktivieren
                makeDraggable(leftImg);
                makeDraggable(rightImg);
                
                // Aktiviere Kollisionserkennung
                imagesAreDraggable = true;
            }, 1000);
        }

        // Drag and Drop Funktionalität
        let isDragging = false;
        let currentImg = null;
        let offsetX = 0;
        let offsetY = 0;

        function makeDraggable(img) {
            img.addEventListener('mousedown', startDrag);
            img.addEventListener('touchstart', startDrag);
        }

        function startDrag(e) {
            isDragging = true;
            currentImg = e.target;
            
            const rect = currentImg.getBoundingClientRect();
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            
            e.preventDefault();
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag);
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function drag(e) {
            if (!isDragging || !currentImg) return;
            
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            currentImg.style.left = (clientX - offsetX) + 'px';
            currentImg.style.top = (clientY - offsetY) + 'px';
            
            // Prüfe Kollision während des Draggings
            checkCollision();
        }

        function stopDrag() {
            isDragging = false;
            currentImg = null;
        }

        // Test-Funktion: Drücke 'T' um das Sudoku automatisch zu lösen
        document.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                cells.forEach(input => {
                    const answer = input.dataset.answer;
                    if (answer) {
                        input.value = answer;
                    }
                });
                console.log('Sudoku automatisch gelöst (Test-Modus)');
            }
        });

        // Kollisionserkennung zwischen den Bildern
        let imagesAreDraggable = false;
        let collisionShown = false;

        function checkCollision() {
            if (!imagesAreDraggable || collisionShown) return;

            const leftImg = document.getElementById('leftPerson');
            const rightImg = document.getElementById('rightPerson');

            const rect1 = leftImg.getBoundingClientRect();
            const rect2 = rightImg.getBoundingClientRect();

            const overlap = !(
                rect1.right < rect2.left || 
                rect1.left > rect2.right || 
                rect1.bottom < rect2.top || 
                rect1.top > rect2.bottom
            );

            if (overlap) {
                showPasswordModal();
                collisionShown = true;
            }
        }

        function showPasswordModal() {
            const leftImg = document.getElementById('leftPerson');
            const rightImg = document.getElementById('rightPerson');
            const bubble = document.getElementById('passwordBubble');
            
            const rect1 = leftImg.getBoundingClientRect();
            const rect2 = rightImg.getBoundingClientRect();
            
            // Position zwischen den Bildern berechnen
            const midX = (rect1.left + rect1.right + rect2.left + rect2.right) / 4;
            const midY = (rect1.top + rect1.bottom + rect2.top + rect2.bottom) / 4;
            
            bubble.style.left = midX + 'px';
            bubble.style.top = (midY - 100) + 'px';
            bubble.style.transform = 'translate(-50%, -50%)';
            bubble.classList.add('show');
            
            document.getElementById('passwordInput').focus();
        }

        // Passwort-Validierung
        const correctPassword = 'Fetterson'; // Hier das gewünschte Passwort eintragen
        const passwordInput = document.getElementById('passwordInput');
        const passwordError = document.getElementById('passwordError');
        const submitBtn = document.getElementById('submitPassword');

        submitBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        function checkPassword() {
            const entered = passwordInput.value.trim();
            if (entered === correctPassword) {
                // Erfolgreich - hier zur nächsten Seite navigieren
                window.location.href = 'page5.html';
            } else {
                passwordError.textContent = 'Falsches Passwort. Versuch es nochmal!';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
    </script>

    </body>
    </html>
