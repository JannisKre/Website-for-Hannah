<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für Hannah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('background.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            position: absolute;
            z-index: 2;
            /* Position anpassen: */
            top: 50%;              /* Vertikal: 50% = Mitte, 20% = oben, 80% = unten */
            left: 50%;             /* Horizontal: 50% = Mitte, 20% = links, 80% = rechts */
            transform: translate(-50%, -50%);  /* Zentriert das Element an der gewählten Position */
            pointer-events: none;
        }

        #start-btn {
            background: #FFC700;
            color: #000;
            border: 3px solid #333;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: 'Courier New', monospace;
            pointer-events: auto;
        }

        #start-btn:hover {
            transform: translate(2px, 2px);
        }

        #start-btn:active {
            transform: translate(4px, 4px);
        }

        #text-container {
            display: none;
            margin-top: 50px;
        }

        #typewriter-text {
            font-size: 72px;
            font-weight: 700;
            color: #EB6222;
            letter-spacing: 8px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            min-height: 100px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #EB6222;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hidden {
            display: none;
        }

        /* Animierte Bilder */
        .floating-image {
            position: fixed;
            width: 400px;
            height: 400px;
            object-fit: contain;
            z-index: 3;
            opacity: 0;
            cursor: grab;
            pointer-events: auto;
        }

        .floating-image:active {
            cursor: grabbing;
        }

        .floating-image.dragging {
            z-index: 10;
        }

        /* Herz, das erscheint wenn sich die Bilder berühren */
        #heart {
            position: fixed;
            width: 0;
            height: 0;
            opacity: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.4s ease-out, opacity 0.3s ease-out, width 0.4s ease-out, height 0.4s ease-out, font-size 0.4s ease-out;
            z-index: 4;
            pointer-events: none;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        #heart.heart-visible {
            width: 50px;
            height: 100px;
            font-size: 120px;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
            cursor: pointer;
        }

        .image-left {
            width: 600px;
            height: 600px;
            bottom: 20%;
            left: -200px;
        }

        .image-right {
            width: 420px;
            height: 420px;
            bottom: 20%;
            right: -200px;
        }

        .slide-in-left {
            animation: slideInLeft 1.5s ease-out forwards;
        }

        .slide-in-right {
            animation: slideInRight 1.5s ease-out forwards;
        }

        @keyframes slideInLeft {
            to {
                left: 5%;
                opacity: 1;
            }
        }

        @keyframes slideInRight {
            to {
                right: 10%;
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            #typewriter-text {
                font-size: 48px;
                letter-spacing: 4px;
            }

            #start-btn {
                padding: 15px 30px;
                font-size: 20px;
            }

            .floating-image {
                width: 100px;
                height: 100px;
            }

            .image-left {
                bottom: 10%;
            }

            .image-right {
                bottom: 10%;
            }
        }
    </style>
</head>
<body>
    <!-- Animierte Bilder -->
    <div id="heart">❤</div>
    <img src="image-left.jpg" alt="Bild Links" class="floating-image image-left" id="imgLeft">
    <img src="image-right.jpg" alt="Bild Rechts" class="floating-image image-right" id="imgRight">
    
    <div class="container">
        <button id="start-btn">START</button>
        <div id="text-container">
            <div id="typewriter-text"></div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const textContainer = document.getElementById('text-container');
        const typewriterText = document.getElementById('typewriter-text');
        const imgLeft = document.getElementById('imgLeft');
        const imgRight = document.getElementById('imgRight');
        const heart = document.getElementById('heart');
        const text = 'FÜR HANNAH';
        let index = 0;

        // Bei Klick auf das Herz zur neuen Seite wechseln (Herz lässt Pointer-Events durch, daher globaler Listener)
        document.addEventListener('click', (e) => {
            // Ignore clicks on images (for dragging)
            if (e.target === imgLeft || e.target === imgRight) return;
            
            if (!heart.classList.contains('heart-visible')) return;
            const rect = heart.getBoundingClientRect();
            const withinX = e.clientX >= rect.left && e.clientX <= rect.right;
            const withinY = e.clientY >= rect.top && e.clientY <= rect.bottom;
            if (withinX && withinY) {
                window.location.href = 'new-picture.html';
            }
        });

        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            textContainer.style.display = 'block';
            
            // Bilder animieren
            imgLeft.classList.add('slide-in-left');
            imgRight.classList.add('slide-in-right');
            
            // Nach der Animation die CSS-Klassen entfernen, damit Dragging funktioniert
            setTimeout(() => {
                // Position VOR dem Entfernen der Klassen ermitteln
                const leftRect = imgLeft.getBoundingClientRect();
                const rightRect = imgRight.getBoundingClientRect();
                
                // Größen explizit setzen, bevor Klassen entfernt werden
                imgLeft.style.width = '600px';
                imgLeft.style.height = '600px';
                imgRight.style.width = '420px';
                imgRight.style.height = '420px';
                
                imgLeft.classList.remove('slide-in-left', 'image-left');
                imgRight.classList.remove('slide-in-right', 'image-right');
                
                // Position final setzen
                imgLeft.style.left = leftRect.left + 'px';
                imgLeft.style.top = leftRect.top + 'px';
                imgLeft.style.bottom = 'auto';
                imgLeft.style.right = 'auto';
                imgLeft.style.opacity = '1';
                
                imgRight.style.left = rightRect.left + 'px';
                imgRight.style.top = rightRect.top + 'px';
                imgRight.style.bottom = 'auto';
                imgRight.style.right = 'auto';
                imgRight.style.opacity = '1';

                checkTouch();
            }, 1500);
            
            typeWriter();
        });

        function typeWriter() {
            if (index < text.length) {
                typewriterText.innerHTML = text.substring(0, index + 1) + '<span class="cursor"></span>';
                index++;
                setTimeout(typeWriter, 200); // Geschwindigkeit des Tippens (200ms pro Buchstabe)
            } else {
                // Cursor bleibt am Ende
                typewriterText.innerHTML = text + '<span class="cursor"></span>';
            }
        }

        // Drag and Drop Funktionalität
        let isDragging = false;
        let currentImage = null;
        let offsetX = 0;
        let offsetY = 0;

        function checkTouch() {
            const leftRect = imgLeft.getBoundingClientRect();
            const rightRect = imgRight.getBoundingClientRect();

            // Require a small overlap area before showing the heart
            const overlapX = Math.min(leftRect.right, rightRect.right) - Math.max(leftRect.left, rightRect.left);
            const overlapY = Math.min(leftRect.bottom, rightRect.bottom) - Math.max(leftRect.top, rightRect.top);
            const overlapThreshold = 300; // pixels of overlap required in both axes

            const overlaps = overlapX > overlapThreshold && overlapY > overlapThreshold;

            if (overlaps) {
                const midX = ((leftRect.left + leftRect.right) / 2 + (rightRect.left + rightRect.right) / 2) / 2;
                const midY = ((leftRect.top + leftRect.bottom) / 2 + (rightRect.top + rightRect.bottom) / 2) / 2;
                heart.style.left = midX + 'px';
                heart.style.top = midY + 'px';
                heart.classList.add('heart-visible');
            } else {
                heart.classList.remove('heart-visible');
            }
        }

        function makeDraggable(element) {
            element.addEventListener('mousedown', startDrag);
            element.addEventListener('touchstart', startDrag);
        }

        function startDrag(e) {
            isDragging = true;
            currentImage = e.target;
            currentImage.classList.add('dragging');
            
            const rect = currentImage.getBoundingClientRect();
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            
            e.preventDefault();
            e.stopPropagation();
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag);
        
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function drag(e) {
            if (!isDragging || !currentImage) return;
            
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            currentImage.style.left = (clientX - offsetX) + 'px';
            currentImage.style.top = (clientY - offsetY) + 'px';
            currentImage.style.right = 'auto';
            currentImage.style.bottom = 'auto';

            checkTouch();
        }

        function stopDrag() {
            if (currentImage) {
                currentImage.classList.remove('dragging');
            }
            isDragging = false;
            currentImage = null;
        }

        // Bilder draggable machen
        makeDraggable(imgLeft);
        makeDraggable(imgRight);
    </script>
</body>
</html>
