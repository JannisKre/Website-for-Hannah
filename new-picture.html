<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für Hannah – Neues Bild</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #FFF1D6;
            color: #1f1f1f;
            text-align: center;
            padding: 32px;
        }
        h1 { font-size: 48px; margin-bottom: 16px; color: #EB6222; font-weight: 700; }
        p { font-size: 20px; margin-bottom: 32px; max-width: 640px; color: #EB6222; }
        .photo-frame {
            width: min(90vw, 520px);
            background: #fff;
            border-radius: 0;
            border: 4px solid #333;
            padding: 16px;
        }
        .photo-frame img {
            width: 100%;
            display: block;
            border-radius: 12px;
            object-fit: cover;
            aspect-ratio: 4 / 5;
            background: #f7f7f7;
        }
        .next-link {
            margin-top: 28px;
            color: #000;
            font-weight: 700;
            text-decoration: none;
            background: #FFC700;
            padding: 12px 24px;
            border-radius: 0;
            border: 3px solid #333;
            transition: all 0.15s ease;
            display: inline-block;
            font-family: 'Courier New', monospace;
        }
        .next-link:hover { transform: translate(2px, 2px); }
        .next-link:active { transform: translate(4px, 4px); }
    </style>
</head>
<body>
    <h1>AHHHHHH</h1>
    <p>Ein Kuss!</p>
    <div class="photo-frame">
        <img src="new-picture.jpg" alt="Neues Bild für Hannah">
    </div>
    <a class="next-link" href="page3.html">Weiter</a>
</body>
</html>
